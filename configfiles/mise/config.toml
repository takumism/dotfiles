[settings]
paranoid = true
minimum_release_age = "7d"
disable_backends = ["asdf"]

[settings.github]
use_git_credentials = true

[tools]
# Global developer tools. Keep these fuzzy and let minimum_release_age avoid
# freshly-published versions; pin exact versions in project configs.
"aws-cli" = "latest"
"aws-vault" = "latest"
"claude-code" = "latest"
"aqua:neovim/neovim" = "latest"
"cargo:procs" = "latest"
atuin = "latest"
bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
go = "latest"
jq = "latest"
lazygit = "latest"
ripgrep = "latest"
rust = "latest"
yazi = "latest"
zellij = "latest"
zoxide = "latest"
